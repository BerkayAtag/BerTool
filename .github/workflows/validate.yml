name: Validate BerTool
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Build and unit tests
        shell: pwsh
        run: |
          dotnet build BerTool.TrayAgent.sln -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test tests/BerTool.Tests/BerTool.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # Kod imzalama isteğe bağlıdır. Depo ayarlarında BERTOOL_SIGN_PFX_BASE64 ve
      # BERTOOL_SIGN_PFX_PASSWORD secret'ları tanımlanırsa setup'lar imzalanır.
      # Pull request'lerde secret yoktur; kurulumlar imzasız üretilir.
      - name: Prepare code signing certificate
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.BERTOOL_SIGN_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGN_PFX_BASE64)) {
            Write-Host 'Kod imzalama secret tanımlı değil; setup dosyaları imzasız üretilecek.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'bertool-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "BERTOOL_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "BERTOOL_EXPECT_SIGNED=1" >> $env:GITHUB_ENV
      - name: Build setup files
        shell: cmd
        env:
          BERTOOL_SIGN_PFX_PASSWORD: ${{ secrets.BERTOOL_SIGN_PFX_PASSWORD }}
        run: call build-setups.cmd
      - name: Remove code signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'bertool-sign.pfx') -Force -ErrorAction SilentlyContinue
      - name: Install setups and verify appwiz Publisher and icon
        id: install
        shell: pwsh
        run: ./tests/Smoke.Installers.ps1 -Phase Install
      - name: End-to-end use case scenarios with the real Windows agent
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          $version = (Select-String -Path Installer/BerToolSetup.iss -Pattern '#define MyAppVersion "(.+)"').Matches[0].Groups[1].Value
          $restart = "powershell -NoProfile -ExecutionPolicy Bypass -File `"$env:LOCALAPPDATA\BerToolServer\stop-server.ps1`" && powershell -NoProfile -ExecutionPolicy Bypass -File `"$env:LOCALAPPDATA\BerToolServer\start-server.ps1`""
          python tests/e2e/scenarios.py --base http://127.0.0.1:5081 --agent live `
            --credentials "$env:LOCALAPPDATA\BerToolServer\data\bootstrap-credentials.txt" `
            --expect-version $version --server-restart-cmd $restart `
            --output "dist/$version/e2e-results.json"
          if ($LASTEXITCODE) {
            Get-Content "$env:LOCALAPPDATA\BerTool\Logs\tray-agent.log" -Tail 80 -ErrorAction SilentlyContinue
            Get-Content "$env:LOCALAPPDATA\BerToolServer\logs\server.out.log" -Tail 80 -ErrorAction SilentlyContinue
            exit $LASTEXITCODE
          }
      - name: Uninstall and verify cleanup
        if: ${{ always() && steps.install.outcome == 'success' }}
        shell: pwsh
        run: ./tests/Smoke.Installers.ps1 -Phase Uninstall
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && steps.install.outcome == 'success' }}
        with:
          name: BerTool-setup-win-x64
          path: dist/*/*
          if-no-files-found: error
          retention-days: 14
