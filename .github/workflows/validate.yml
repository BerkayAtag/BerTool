name: Validate BerTool
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Build and unit tests
        shell: pwsh
        run: |
          dotnet build BerTool.TrayAgent.sln -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet test tests/BerTool.Tests/BerTool.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build setup files
        shell: cmd
        run: call build-setups.cmd
      - name: Verify Windows installation, appwiz Publisher and icon
        shell: pwsh
        run: ./tests/Smoke.Installers.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BerTool-setup-win-x64
          path: dist/*/*
          if-no-files-found: error
          retention-days: 14
